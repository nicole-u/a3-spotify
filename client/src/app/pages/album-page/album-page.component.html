@if(album) {
	<div class="row">
		<div class="col-12 col-sm-6">
			<h1>{{album.name}}</h1>
			<img id="albumImg" [src]="album.imageURL">
			<app-thermometer [popularity] = "album.popularity.percentageString" [color] = "album.popularity.color" [percent] = "album.popularity.percent * 100" []></app-thermometer>
			@for (artist of album.artists; track artist) {
				<p>
					Artist: <a [routerLink] = "['/artist/' + artist.id]">{{artist.name}}</a>
				</p>
			}
			<p>
				<a class="btn btn-light" role="button" target="_blank" [href]="album.url">Open {{album.name}} on Spotify</a>
			</p>
		</div>
		<div class="col-12 col-sm-6">
			<h3>Album Tracks</h3>
			<app-track-list hideArtist = "true" hideAlbum = "true" [tracks] = "tracks"></app-track-list>
		</div>
	</div>
}
