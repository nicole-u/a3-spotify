<div class="row">
	@if(track) {
		<div class="col-sm-6 col-12">
			<h1>{{track.name}}</h1>
			<p>
				Track on <a [routerLink] = "['/album' + track.album.id]">{{track.album.name}}</a>
			</p>
			<div>
				@for (artist of track.artists; track artist) {
				<p>
					Artist: <a [routerLink] = "['/artist' + track.artists[0].id]">{{artist.name}}</a>
				</p>
				}
			</div>
			<p>
				Duration: {{track.durationStr}}
			</p>
			<p>
				<a class="btn btn-light" role="button" target="_blank">Open {{track.name}} on Spotify</a>
			</p>
		</div>
		<div class="col-sm-6 col-12">
			<app-thermometer [popularity] = "track.popularity.percentageString" [percent] = "track.popularity.percent * 100" [color] = "track.popularity.color"></app-thermometer>
		</div>
	}
</div>
